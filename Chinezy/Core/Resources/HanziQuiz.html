<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hanzi Stroke Animator</title>
    <style>
        /* ── Reset & Transparent Background ──────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            /* NOTE: pointer-events NOT disabled here.
               Touch is controlled by WKWebView.isUserInteractionEnabled
               from Swift (disabled for animation-only, enabled for quiz mode). */
        }

        #writer-container {
            position: relative;
            width: 100vmin;
            height: 100vmin;
        }

        #writer-container svg {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <!-- ── SVG practice grid (standard Hanzi Writer guide lines) ─────── -->
    <svg xmlns="http://www.w3.org/2000/svg" id="grid-background" width="100" height="100" viewBox="0 0 100 100"
        style="position:absolute; width:100vmin; height:100vmin;">
        <!-- Outer border -->
        <line x1="0" y1="0" x2="100" y2="0" stroke="#DDD" stroke-width="2" />
        <line x1="0" y1="0" x2="0" y2="100" stroke="#DDD" stroke-width="2" />
        <line x1="100" y1="0" x2="100" y2="100" stroke="#DDD" stroke-width="2" />
        <line x1="0" y1="100" x2="100" y2="100" stroke="#DDD" stroke-width="2" />
        <!-- Cross (vertical + horizontal midlines) -->
        <line x1="50" y1="0" x2="50" y2="100" stroke="#DDD" stroke-width="1" stroke-dasharray="4,4" />
        <line x1="0" y1="50" x2="100" y2="50" stroke="#DDD" stroke-width="1" stroke-dasharray="4,4" />
        <!-- Diagonals -->
        <line x1="0" y1="0" x2="100" y2="100" stroke="#DDD" stroke-width="1" stroke-dasharray="4,4" />
        <line x1="100" y1="0" x2="0" y2="100" stroke="#DDD" stroke-width="1" stroke-dasharray="4,4" />
    </svg>

    <!-- Hanzi Writer renders into this container -->
    <div id="writer-container"></div>

    <!-- ── Load the bundled Hanzi Writer library ──────────────────────── -->
    <script src="hanzi-writer.min.js"></script>

    <script>
        // ── Globals ──────────────────────────────────────────────────────
        var writer = null;
        var totalStrokes = 0;

        // ================================================================
        // MODE 1: ANIMATION-ONLY (used by ExerciseContainerView)
        // ================================================================

        function loadBase64Character(character, base64String) {
            try {
                var container = document.getElementById('writer-container');
                container.innerHTML = '';

                var size = Math.min(window.innerWidth, window.innerHeight);
                const decodedString = decodeURIComponent(escape(window.atob(base64String)));
                const charData = JSON.parse(decodedString);

                writer = HanziWriter.create('writer-container', character, {
                    width: size,
                    height: size,
                    padding: 0,
                    showCharacter: false,
                    showOutline: true,
                    strokeAnimationSpeed: 5,
                    delayBetweenStrokes: 0,
                    charDataLoader: function(char, onLoad) { onLoad(charData); },
                    strokeColor: '#333',
                    outlineColor: '#CCCCCC',
                    drawingWidth: 12
                });
                
                totalStrokes = charData.strokes.length;
                console.log("✅ JS SUCCESS: Character " + character + " loaded successfully for animation.");
            } catch (e) {
                console.error("❌ JS ERROR loading animation for " + character + ":", e);
            }
        }

        function animateStroke(strokeIndex) {
            if (!writer) return;

            writer.animateStroke(strokeIndex, {
                onComplete: function () {
                    if (strokeIndex >= totalStrokes - 1) {
                        if (window.webkit && window.webkit.messageHandlers &&
                            window.webkit.messageHandlers.allStrokesCompleted) {
                            window.webkit.messageHandlers.allStrokesCompleted
                                .postMessage(true);
                        }
                    }
                }
            });
        }

        // ================================================================
        // MODE 2: INTERACTIVE QUIZ (used by WritingQuizView)
        // ================================================================

        function loadBase64CharacterForQuiz(character, base64String) {
            try {
                var container = document.getElementById('writer-container');
                container.innerHTML = '';

                var size = Math.min(window.innerWidth, window.innerHeight);
                const decodedString = decodeURIComponent(escape(window.atob(base64String)));
                const charData = JSON.parse(decodedString);

                writer = HanziWriter.create('writer-container', character, {
                    width: size,
                    height: size,
                    padding: 0,
                    showCharacter: false,
                    showOutline: true,
                    strokeAnimationSpeed: 3,
                    charDataLoader: function(char, onLoad) { onLoad(charData); },
                    strokeColor: '#333',
                    outlineColor: '#CCCCCC',
                    drawingColor: '#B23A2F',
                    drawingWidth: 16,
                    showHintAfterMisses: 3,
                    highlightOnComplete: true,
                    highlightColor: '#1E8C5F'
                });
                
                totalStrokes = charData.strokes.length;
                startQuiz();
                console.log("✅ JS SUCCESS: Character " + character + " loaded successfully for quiz.");
            } catch (e) {
                console.error("❌ JS ERROR loading quiz for " + character + ":", e);
            }
        }

        function startQuiz() {
            if (!writer) return;

            writer.quiz({
                onCorrectStroke: function (strokeData) {
                    if (window.webkit && window.webkit.messageHandlers &&
                        window.webkit.messageHandlers.strokeCorrect) {
                        window.webkit.messageHandlers.strokeCorrect.postMessage({
                            strokeNum: strokeData.strokeNum,
                            mistakesOnStroke: strokeData.mistakesOnStroke,
                            totalMistakes: strokeData.totalMistakes,
                            strokesRemaining: strokeData.strokesRemaining
                        });
                    }
                },
                onMistake: function (strokeData) {
                    if (window.webkit && window.webkit.messageHandlers &&
                        window.webkit.messageHandlers.strokeMistake) {
                        window.webkit.messageHandlers.strokeMistake.postMessage({
                            strokeNum: strokeData.strokeNum,
                            mistakesOnStroke: strokeData.mistakesOnStroke,
                            totalMistakes: strokeData.totalMistakes,
                            strokesRemaining: strokeData.strokesRemaining
                        });
                    }
                },
                onComplete: function (summaryData) {
                    if (window.webkit && window.webkit.messageHandlers &&
                        window.webkit.messageHandlers.quizComplete) {
                        window.webkit.messageHandlers.quizComplete.postMessage({
                            totalMistakes: summaryData.totalMistakes
                        });
                    }
                }
            });
        }

        // ================================================================
        // SHARED UTILITIES
        // ================================================================

        function animateFullCharacter() {
            if (!writer) return;
            writer.animateCharacter();
        }

        function resetCharacter() {
            if (!writer) return;
            writer.hideCharacter();
        }

        window.addEventListener('resize', function() {
            if (writer) {
                var newSize = Math.min(window.innerWidth, window.innerHeight);
                writer.updateDimensions({ width: newSize, height: newSize });
            }
        });

    </script>
</body>

</html>
