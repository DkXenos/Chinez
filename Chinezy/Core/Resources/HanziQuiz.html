<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hanzi Stroke Animator</title>
    <style>
        /* ── Reset & Transparent Background ──────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            /* NOTE: pointer-events NOT disabled here.
               Touch is controlled by WKWebView.isUserInteractionEnabled
               from Swift (disabled for animation-only, enabled for quiz mode). */
        }

        #writer-container {
            position: relative;
            width: 100vmin;
            height: 100vmin;
        }

        #writer-container svg {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <!-- ── SVG practice grid (standard Hanzi Writer guide lines) ─────── -->
    <svg xmlns="http://www.w3.org/2000/svg" id="grid-background" width="100" height="100" viewBox="0 0 100 100"
        style="position:absolute; width:100vmin; height:100vmin;">
        <!-- Outer border -->
        <line x1="0" y1="0" x2="100" y2="0" stroke="#DDD" stroke-width="2" />
        <line x1="0" y1="0" x2="0" y2="100" stroke="#DDD" stroke-width="2" />
        <line x1="100" y1="0" x2="100" y2="100" stroke="#DDD" stroke-width="2" />
        <line x1="0" y1="100" x2="100" y2="100" stroke="#DDD" stroke-width="2" />
        <!-- Cross (vertical + horizontal midlines) -->
        <line x1="50" y1="0" x2="50" y2="100" stroke="#DDD" stroke-width="1" stroke-dasharray="4,4" />
        <line x1="0" y1="50" x2="100" y2="50" stroke="#DDD" stroke-width="1" stroke-dasharray="4,4" />
        <!-- Diagonals -->
        <line x1="0" y1="0" x2="100" y2="100" stroke="#DDD" stroke-width="1" stroke-dasharray="4,4" />
        <line x1="100" y1="0" x2="0" y2="100" stroke="#DDD" stroke-width="1" stroke-dasharray="4,4" />
    </svg>

    <!-- Hanzi Writer renders into this container -->
    <div id="writer-container"></div>

    <!-- ── Load the bundled Hanzi Writer library ──────────────────────── -->
    <script src="hanzi-writer.min.js"></script>

    <script>
        // ── Globals ──────────────────────────────────────────────────────
        var writer = null;
        var totalStrokes = 0;

        /**
         * injectedLocalData — populated by Swift via evaluateJavaScript
         * BEFORE the writer is initialized.
         * Should contain the full HanziWriter data object:
         * { strokes: [...], medians: [...], radStrokes: [...] }
         *
         * If only medians are available (our current HSK1_StrokeData.json),
         * the charDataLoader will fall back to CDN for the full data.
         */
        var injectedLocalData = null;

        /**
         * charDataLoader — resolves character data using the OFFLINE BRIDGE.
         *
         * Priority:
         * 1. Use injectedLocalData from Swift (if it has full stroke SVG paths)
         * 2. Fallback to CDN (temporary, until full data is bundled)
         *
         * Per HanziWriterContext.md §2-3: Swift MUST inject data before
         * writer initialization. The custom charDataLoader checks local first.
         */
        function charDataLoader(character, onLoad, onError) {
            // ── 1. Check Swift-injected local data ──────────────────────
            if (injectedLocalData && injectedLocalData.strokes && injectedLocalData.strokes.length > 0) {
                console.log('[HanziQuiz] Using injected local data for: ' + character);
                totalStrokes = injectedLocalData.strokes.length;
                onLoad(injectedLocalData);
                // Clear after use so next character gets fresh data
                injectedLocalData = null;
                return;
            }

            // ── 2. Fallback: CDN fetch (temporary until full data bundled) ─
            console.log('[HanziQuiz] Local data missing strokes for: ' + character + ', falling back to CDN');
            fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@latest/' + character + '.json')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    totalStrokes = data.strokes.length;
                    onLoad(data);
                })
                .catch(function (err) {
                    console.error('[HanziQuiz] Failed to load character data for: ' + character, err);
                    if (onError) onError(err);
                });
        }

        // ================================================================
        // MODE 1: ANIMATION-ONLY (used by ExerciseContainerView)
        // Swift calls loadCharacter() + animateStroke() individually.
        // User interaction is disabled on the WKWebView from Swift.
        // ================================================================

        /**
         * loadCharacter(character)
         * Called from Swift. Creates the HanziWriter instance with the
         * character's outline visible but all strokes initially hidden.
         * The native PencilKit layer calls animateStroke() one-by-one.
         */
        function loadCharacter(character) {
            var container = document.getElementById('writer-container');
            container.innerHTML = '';

            var size = Math.min(window.innerWidth, window.innerHeight);

            writer = HanziWriter.create('writer-container', character, {
                width: size,
                height: size,
                padding: 0,
                showCharacter: false,
                showOutline: true,
                strokeAnimationSpeed: 5,
                delayBetweenStrokes: 0,
                charDataLoader: charDataLoader,
                strokeColor: '#333',
                outlineColor: '#CCCCCC',
                drawingWidth: 12
            });
        }

        /**
         * animateStroke(strokeIndex)
         * Called from Swift after the native StrokeValidator confirms a
         * correct stroke. Animates the nth stroke, "inking in" the path.
         * After the last stroke, sends `allStrokesCompleted` to Swift.
         */
        function animateStroke(strokeIndex) {
            if (!writer) {
                console.warn('[HanziQuiz] animateStroke called but writer is null');
                return;
            }

            writer.animateStroke(strokeIndex, {
                onComplete: function () {
                    if (strokeIndex >= totalStrokes - 1) {
                        if (window.webkit && window.webkit.messageHandlers &&
                            window.webkit.messageHandlers.allStrokesCompleted) {
                            window.webkit.messageHandlers.allStrokesCompleted
                                .postMessage(true);
                        }
                    }
                }
            });
        }

        // ================================================================
        // MODE 2: INTERACTIVE QUIZ (used by WritingQuizView)
        // HanziWriter handles all touch interaction via writer.quiz().
        // Sends strokeCorrect / strokeMistake / quizComplete to Swift.
        // ================================================================

        /**
         * loadCharacterForQuiz(character)
         * Called from Swift. Creates writer + immediately starts quiz mode.
         * Per HanziWriterContext.md §4: writer.quiz() MUST be called
         * immediately after initialization.
         */
        function loadCharacterForQuiz(character) {
            var container = document.getElementById('writer-container');
            container.innerHTML = '';

            var size = Math.min(window.innerWidth, window.innerHeight);

            writer = HanziWriter.create('writer-container', character, {
                width: size,
                height: size,
                padding: 0,
                showCharacter: false,
                showOutline: true,
                strokeAnimationSpeed: 3,
                charDataLoader: charDataLoader,
                strokeColor: '#333',
                outlineColor: '#CCCCCC',
                drawingColor: '#B23A2F',
                drawingWidth: 16,
                showHintAfterMisses: 3,
                highlightOnComplete: true,
                highlightColor: '#1E8C5F'
            });

            // Start quiz mode immediately (§4)
            startQuiz();
        }

        /**
         * startQuiz()
         * Activates HanziWriter's interactive quiz mode.
         * Sends messages back to Swift via webkit.messageHandlers.
         */
        function startQuiz() {
            if (!writer) {
                console.warn('[HanziQuiz] startQuiz called but writer is null');
                return;
            }

            writer.quiz({
                onCorrectStroke: function (strokeData) {
                    if (window.webkit && window.webkit.messageHandlers &&
                        window.webkit.messageHandlers.strokeCorrect) {
                        window.webkit.messageHandlers.strokeCorrect.postMessage({
                            strokeNum: strokeData.strokeNum,
                            mistakesOnStroke: strokeData.mistakesOnStroke,
                            totalMistakes: strokeData.totalMistakes,
                            strokesRemaining: strokeData.strokesRemaining
                        });
                    }
                },
                onMistake: function (strokeData) {
                    if (window.webkit && window.webkit.messageHandlers &&
                        window.webkit.messageHandlers.strokeMistake) {
                        window.webkit.messageHandlers.strokeMistake.postMessage({
                            strokeNum: strokeData.strokeNum,
                            mistakesOnStroke: strokeData.mistakesOnStroke,
                            totalMistakes: strokeData.totalMistakes,
                            strokesRemaining: strokeData.strokesRemaining
                        });
                    }
                },
                onComplete: function (summaryData) {
                    if (window.webkit && window.webkit.messageHandlers &&
                        window.webkit.messageHandlers.quizComplete) {
                        window.webkit.messageHandlers.quizComplete.postMessage({
                            totalMistakes: summaryData.totalMistakes
                        });
                    }
                }
            });
        }

        // ================================================================
        // SHARED UTILITIES
        // ================================================================

        /**
         * animateFullCharacter()
         * Plays the full stroke-order animation (demo/review).
         */
        function animateFullCharacter() {
            if (!writer) return;
            writer.animateCharacter();
        }

        /**
         * resetCharacter()
         * Hides all strokes to restart.
         */
        function resetCharacter() {
            if (!writer) return;
            writer.hideCharacter();
        }
    </script>

</body>

</html>
